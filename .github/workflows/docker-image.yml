name: Build Docker Image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "crates/**"
      - "package-lock.json"
      - "package.json"
      - "playwright.config.ts"
      - "scripts/prepare-server-web.mjs"
      - "scripts/e2e-server.mjs"
      - "scripts/self-host-smoke.mjs"
      - "src/**"
      - "tests/e2e/**"
      - "tsconfig*.json"
      - "vite.config.ts"
  pull_request:
    paths:
      - ".github/workflows/docker-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "crates/**"
      - "package-lock.json"
      - "package.json"
      - "playwright.config.ts"
      - "scripts/prepare-server-web.mjs"
      - "scripts/e2e-server.mjs"
      - "scripts/self-host-smoke.mjs"
      - "src/**"
      - "tests/e2e/**"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  docker:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build image
        run: docker build --pull -t trace-self-host:ci .

      - name: Create test volume
        run: docker volume create trace-self-host-ci-data

      - name: Run container
        run: docker run -d --name trace-self-host-ci -p 18080:8080 -v trace-self-host-ci-data:/data trace-self-host:ci

      - name: Wait for health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs trace-self-host-ci
          exit 1

      - name: Run self-host smoke test
        run: npm run smoke:self-host

      - name: Restart container with same volume
        run: |
          docker stop trace-self-host-ci
          docker rm trace-self-host-ci
          docker run -d --name trace-self-host-ci -p 18080:8080 -v trace-self-host-ci-data:/data trace-self-host:ci

      - name: Wait for restarted health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs trace-self-host-ci
          exit 1

      - name: Run self-host smoke test after restart
        run: npm run smoke:self-host

      - name: Show server logs
        if: always()
        run: docker logs trace-self-host-ci || true

      - name: Stop container
        if: always()
        run: docker rm -f trace-self-host-ci || true

      - name: Remove test volume
        if: always()
        run: docker volume rm trace-self-host-ci-data || true

  e2e:
    name: Web E2E tests
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust workspace
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run trace-server API integration tests
        run: cargo test -p trace-server --test api_test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e

      - name: Print Playwright error contexts
        if: failure()
        run: |
          find test-results -name error-context.md -print -exec cat {} \; || true

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
