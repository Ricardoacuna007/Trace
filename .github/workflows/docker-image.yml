name: Build Docker Image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "crates/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/prepare-server-web.mjs"
      - "src/**"
      - "tsconfig*.json"
      - "vite.config.ts"
  pull_request:
    paths:
      - ".github/workflows/docker-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "crates/**"
      - "package-lock.json"
      - "package.json"
      - "scripts/prepare-server-web.mjs"
      - "src/**"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  docker:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t trace-self-host:ci .

      - name: Run container
        run: docker run --rm -d --name trace-self-host-ci -p 18080:8080 trace-self-host:ci

      - name: Wait for health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs trace-self-host-ci
          exit 1

      - name: Show server logs
        if: always()
        run: docker logs trace-self-host-ci || true

      - name: Stop container
        if: always()
        run: docker stop trace-self-host-ci || true
