name: Build Docker Image

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "crates/**"
      - "package-lock.json"
      - "package.json"
      - "playwright.config.ts"
      - "scripts/prepare-server-web.mjs"
      - "scripts/e2e-server.mjs"
      - "src/**"
      - "tests/e2e/**"
      - "tsconfig*.json"
      - "vite.config.ts"
  pull_request:
    paths:
      - ".github/workflows/docker-image.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "Dockerfile"
      - "docker-compose.yml"
      - "crates/**"
      - "package-lock.json"
      - "package.json"
      - "playwright.config.ts"
      - "scripts/prepare-server-web.mjs"
      - "scripts/e2e-server.mjs"
      - "src/**"
      - "tests/e2e/**"
      - "tsconfig*.json"
      - "vite.config.ts"

permissions:
  contents: read

jobs:
  docker:
    name: Build and smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --pull -t trace-self-host:ci .

      - name: Run container
        run: docker run --rm -d --name trace-self-host-ci -p 18080:8080 trace-self-host:ci

      - name: Wait for health check
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:18080/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs trace-self-host-ci
          exit 1

      - name: Show server logs
        if: always()
        run: docker logs trace-self-host-ci || true

      - name: Stop container
        if: always()
        run: docker stop trace-self-host-ci || true

  e2e:
    name: Web E2E tests
    runs-on: ubuntu-latest
    needs: docker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust workspace
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Run trace-server API integration tests
        run: cargo test -p trace-server --test api_test

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run e2e
