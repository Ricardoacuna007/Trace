name: Build Linux Desktop

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  linux-desktop:
    name: Linux desktop bundles
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libfuse2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust workspace
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        run: npm ci

      - name: Validate project
        run: npm run check

      - name: Build Linux bundles
        run: |
          mkdir -p target
          set -o pipefail
          npm run desktop:build:linux 2>&1 | tee target/linux-desktop-build.log

      - name: Build trace-server binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run server:build

      - name: Package trace-server binary
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p target/trace-server-linux-x86_64
          cp target/release/trace-server target/trace-server-linux-x86_64/trace-server
          cp README.md target/trace-server-linux-x86_64/README.md
          cp docs/getting-started.md target/trace-server-linux-x86_64/getting-started.md
          tar -C target -czf target/trace-server-linux-x86_64.tar.gz trace-server-linux-x86_64
          sha256sum target/trace-server-linux-x86_64.tar.gz > target/trace-server-linux-x86_64.tar.gz.sha256

      - name: Report Linux build failure
        if: failure()
        run: |
          echo "### Linux desktop build log" >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          tail -n 160 target/linux-desktop-build.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          message="$(tail -n 80 target/linux-desktop-build.log | tr '\n' ' ' | sed 's/%/%25/g; s/\r/%0D/g')"
          echo "::error title=Linux desktop build failed::$message"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trace-linux-x86_64
          if-no-files-found: error
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Upload trace-server Linux binary
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: trace-server-linux-x86_64
          if-no-files-found: error
          path: |
            target/trace-server-linux-x86_64.tar.gz
            target/trace-server-linux-x86_64.tar.gz.sha256

      - name: Upload Linux build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-linux-build-log
          path: target/linux-desktop-build.log
          if-no-files-found: ignore

      - name: Attach bundles to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          files: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            target/trace-server-linux-x86_64.tar.gz
            target/trace-server-linux-x86_64.tar.gz.sha256
